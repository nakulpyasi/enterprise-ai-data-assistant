[project]
name = "enterprise-ai-data-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NakulPyasi", email = "nakulpyasi@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.25.3",
    "azure-search-documents>=12.0.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.1",
]

[project.scripts]
enterprise-ai-data-assistant = "enterprise_ai_data_assistant:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
